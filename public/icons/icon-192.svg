<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" rx="38" fill="url(#bg)"/>
  
  <!-- Camera body -->
  <rect x="40" y="54" width="112" height="88" rx="14" fill="#ffffff"/>
  
  <!-- Camera top bump -->
  <rect x="74" y="44" width="44" height="14" rx="6" fill="#ffffff"/>
  
  <!-- Lens outer ring -->
  <circle cx="96" cy="98" r="34" fill="url(#bg)" opacity="0.12"/>
  
  <!-- Lens ring -->
  <circle cx="96" cy="98" r="30" fill="#e0e7ff" opacity="0.8"/>
  
  <!-- Lens -->
  <circle cx="96" cy="98" r="24" fill="url(#lens)"/>
  
  <!-- Inner lens highlight -->
  <circle cx="96" cy="98" r="18" fill="url(#lens)" opacity="0.9"/>
  
  <!-- S letter in lens -->
  <text x="96" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="central">S</text>
  
  <!-- Flash dot -->
  <circle cx="54" cy="64" r="5" fill="#ffffff" opacity="0.8"/>
  
  <!-- Subtle body lines -->
  <line x1="66" y1="118" x2="78" y2="118" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <line x1="114" y1="118" x2="126" y2="118" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
</svg>
