<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Camera body -->
  <rect x="108" y="144" width="296" height="232" rx="36" fill="#ffffff"/>
  
  <!-- Camera top bump -->
  <rect x="196" y="116" width="120" height="36" rx="16" fill="#ffffff"/>
  
  <!-- Lens outer ring -->
  <circle cx="256" cy="260" r="90" fill="url(#bg)" opacity="0.12"/>
  
  <!-- Lens ring -->
  <circle cx="256" cy="260" r="80" fill="#e0e7ff" opacity="0.8"/>
  
  <!-- Lens -->
  <circle cx="256" cy="260" r="64" fill="url(#lens)"/>
  
  <!-- Inner lens highlight -->
  <circle cx="256" cy="260" r="48" fill="url(#lens)" opacity="0.9"/>
  
  <!-- S letter in lens -->
  <text x="256" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="central">S</text>
  
  <!-- Flash dot -->
  <circle cx="144" cy="172" r="12" fill="#ffffff" opacity="0.8"/>
  
  <!-- Subtle body lines -->
  <line x1="176" y1="312" x2="208" y2="312" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <line x1="304" y1="312" x2="336" y2="312" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
</svg>
